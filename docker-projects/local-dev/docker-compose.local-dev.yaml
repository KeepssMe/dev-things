name: "local-dev"

networks:
    local-dev:
        name: "local-dev"
        driver: "bridge"

services:

    storage.mongodb:
        image: "mongodb/mongodb-community-server:8.2.6-ubi9-slim"
        container_name: "local-dev.storage.mongodb"
        environment:
            - "MONGODB_INITDB_ROOT_USERNAME=${STORAGE_MONGODB_USER}"
            - "MONGODB_INITDB_ROOT_PASSWORD=${STORAGE_MONGODB_PASSWORD}"
        volumes:
            - "./volumes/mongodb-data:/data/db"
            - "./volumes/mongodb-config:/data/configdb"
        ports:
            - "${STORAGE_MONGODB_PORT}:27017"
        networks:
            - "local-dev"
        deploy:
            resources:
                limits:
                    memory: "1G"
        command: ["mongod", "--bind_ip_all"]

    storage.rabbitmq:
        image: "rabbitmq:4.2.5-management-alpine"
        container_name: "local-dev.storage.rabbitmq"
        environment:
            - "RABBITMQ_DEFAULT_USER=${STORAGE_RABBITMQ_USER}"
            - "RABBITMQ_DEFAULT_PASS=${STORAGE_RABBITMQ_PASSWORD}"
            - "RABBITMQ_CLUSTER_NAME=local-dev"
            - "RABBITMQ_NODENAME=local-dev-node-1"
            - "RABBITMQ_ERLANG_COOKIE=secret-rabbitmq-cookie"
        volumes:
            - "./volumes/rabbitmq-data:/var/lib/rabbitmq"
        ports:
            - "${STORAGE_RABBITMQ_AMQP_PORT}:5672"
            - "${STORAGE_RABBITMQ_HTTP_PORT}:15672"
        networks:
            - "local-dev"
        deploy:
            resources:
                limits:
                    memory: "512M"